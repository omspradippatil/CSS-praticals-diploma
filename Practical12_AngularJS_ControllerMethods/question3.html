<!DOCTYPE html>
<html ng-app="myApp">
<head>
    <title>Q3 - Array Methods in Controller</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
</head>
<body ng-controller="myCtrl">
    <h2>Question 3: Array Methods</h2>
    
    <input type="text" ng-model="newItem" placeholder="Enter item">
    <button ng-click="addItem()">Add</button>
    <button ng-click="removeLastItem()">Remove Last</button>
    
    <ul>
        <li ng-repeat="item in items">{{item}}</li>
    </ul>

    <script>
        var app = angular.module('myApp', []);
        app.controller('myCtrl', function($scope) {
            $scope.items = ['Apple', 'Banana'];
            $scope.newItem = '';
            $scope.addItem = function() {
                if($scope.newItem) {
                    $scope.items.push($scope.newItem);
                    $scope.newItem = '';
                }
            };
            $scope.removeLastItem = function() {
                $scope.items.pop();
            };
        });
    </script>
</body>
</html>
