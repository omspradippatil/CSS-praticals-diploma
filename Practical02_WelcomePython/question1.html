<!DOCTYPE html>

    <link rel="stylesheet" href="https://pyscript.net/releases/2025.8.1/core.css" />

<body>
    <h2>Question 1: Print list of elements using for loop</h2>
    
    <script type="mpy" terminal>
students = ["Amit", "Priya", "Rohan", "Sneha", "Karan"]
print("Student List:")
for student in students:
    print(student)
    </script>
