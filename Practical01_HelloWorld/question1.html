<!DOCTYPE html>
<html>
<head>
    <title>Q1 - Alert Multiline</title>
</head>
<body>
    <h2>Question 1: Display multiline text in alert box</h2>
    
    <button onclick="showAlert()">Click to Show Alert</button>

    <script>
        function showAlert() {
            alert("Line 1: Hello World\nLine 2: From Alert Box\nLine 3: Multiline Text");
        }
    </script>
</body>
</html>
