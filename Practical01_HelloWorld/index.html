<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 1 - Hello World</title>
</head>
<body>
    <h1>Practical 1: Hello World</h1>

    <p>This page shows "Hello World" using three different JavaScript outputs:</p>

    <h2>1. Using document.write()</h2>
    <script>
        document.write("<p>Hello World from document.write()</p>");
    </script>

    <h2>2. Using console.log()</h2>
    <script>
        console.log("Hello World from console.log()");
    </script>

    <h2>3. Using alert()</h2>
    <button onclick="alert('Hello World from alert()')">Show Hello World Alert</button>
</body>
</html>
