<!DOCTYPE html>
<html>
<head>
    <title>Q2 - Document Write HTML</title>
</head>
<body>
    <h2>Question 2: Display text in document.write using HTML formatting tags</h2>
    
    <script>
        document.write("<h3>Hello World</h3>");
        document.write("<p>This is a paragraph with <b>bold</b> text</p>");
        document.write("<p style='color: red;'>This is red colored text</p>");
        document.write("<hr>");
        document.write("<p><u>Underlined text</u></p>");
        document.write("<p><i>Italicized text</i></p>");
    </script>
    
    <p>The above content was written using document.write()</p>
</body>
</html>
