<!DOCTYPE html>
<html ng-app="myApp">
<head>
    <title>Q2 - Currency and Number Filters</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
</head>
<body ng-controller="myCtrl">
    <h2>Question 2: Currency and Number Filters</h2>
    
    <p>Original Price: {{price}}</p>
    <p>Currency Format: {{price | currency}}</p>
    <p>Number Format (2 decimals): {{price | number : 2}}</p>

    <script>
        var app = angular.module('myApp', []);
        app.controller('myCtrl', function($scope) {
            $scope.price = 1234.567;
        });
    </script>
</body>
</html>
