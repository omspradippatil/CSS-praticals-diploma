<!DOCTYPE html>
<html ng-app="myApp">
<head>
    <title>Q2 - Angular Hello World</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
</head>
<body ng-controller="myCtrl">
    <h2>Question 2: Display "Hello World" Message</h2>
    
    <p>{{greeting}}</p>

    <script>
        var app = angular.module('myApp', []);
        app.controller('myCtrl', function($scope) {
            $scope.greeting = "Hello World from AngularJS!";
        });
    </script>
</body>
</html>
