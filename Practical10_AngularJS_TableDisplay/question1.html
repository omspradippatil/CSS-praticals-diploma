<!DOCTYPE html>
<html ng-app="myApp">
<head>
    <title>Q1 - Simple Table Display</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
</head>
<body ng-controller="myCtrl">
    <h2>Question 1: Simple Table Display</h2>
    
    <table border="1">
        <tr>
            <th>Roll</th>
            <th>Name</th>
        </tr>
        <tr ng-repeat="student in students">
            <td>{{student.roll}}</td>
            <td>{{student.name}}</td>
        </tr>
    </table>

    <script>
        var app = angular.module('myApp', []);
        app.controller('myCtrl', function($scope) {
            $scope.students = [
                {roll: 101, name: 'Alice'},
                {roll: 102, name: 'Bob'},
                {roll: 103, name: 'Charlie'}
            ];
        });
    </script>
</body>
</html>
