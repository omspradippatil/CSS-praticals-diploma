<!DOCTYPE html>
<html ng-app="myApp">
<head>
    <title>Q2 - Mouse Events</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
</head>
<body ng-controller="myCtrl">
    <h2>Question 2: Mouse Events</h2>
    
    <button ng-mouseover="onHover()" ng-mouseleave="onLeave()">Hover Me</button>
    <p>{{message}}</p>

    <script>
        var app = angular.module('myApp', []);
        app.controller('myCtrl', function($scope) {
            $scope.message = '';
            $scope.onHover = function() {
                $scope.message = 'Mouse is over the button!';
            };
            $scope.onLeave = function() {
                $scope.message = '';
            };
        });
    </script>
</body>
</html>
