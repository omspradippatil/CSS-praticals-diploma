<!DOCTYPE html>
<html lang="en" ng-app="eventApp">
<head>
    <meta charset="UTF-8">
    <title>Practical 9 - AngularJS Events</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script>
        var app = angular.module("eventApp", []);
        app.controller("EventController", function($scope) {
            $scope.count = 0;
            $scope.message = "Hover over the box";
            $scope.increment = function() {
                $scope.count++;
            };
            $scope.onMouseOver = function() {
                $scope.message = "Mouse is over the box";
            };
            $scope.onMouseOut = function() {
                $scope.message = "Mouse left the box";
            };
        });
    </script>
</head>
<body ng-controller="EventController">
<h1>Practical 9: AngularJS Events</h1>
<button ng-click="increment()">Click me</button>
<p>Button clicked {{ count }} times.</p>

<div ng-mouseover="onMouseOver()" ng-mouseout="onMouseOut()" 
     style="width:200px;height:100px;border:1px solid #000;margin-top:20px;">
    {{ message }}
</div>
</body>
</html>
